<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - DoctorWallah</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <h2>Admin Sign In</h2>
            <form id="login-form">
                <div class="form-group" style="text-align: left;">
                    <label>Username</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group" style="text-align: left;">
                    <label>Password</label>
                    <input type="password" id="password" required>
                </div>
                <div id="login-error" style="color: red; margin-bottom: 15px; font-size: 14px;"></div>
                <button type="submit" class="btn-primary" style="width: 100%;">Sign In</button>
            </form>
            <div style="margin-top: 20px;">
                <a href="../index.html" style="color: var(--text-light); font-size: 14px;"><i class="fa-solid fa-arrow-left"></i> Back to Site</a>
            </div>
        </div>
    </div>
    <script src="../js/admin.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', handleLogin);
    </script>
</body>
</html>
