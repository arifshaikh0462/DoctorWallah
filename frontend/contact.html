<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - DoctorWallah</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .contact-form { background: var(--white); padding: 40px; border-radius: var(--border-radius); box-shadow: var(--shadow-md); text-align: left; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; font-family: inherit; }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--primary-color); }
    </style>
</head>
<body>
    <div class="layout-wrapper">
        <header>
            <div class="container navbar">
                <a href="index.html" class="logo">Doctor<span>Wallah</span></a>
                <nav class="nav-links">
                    <a href="index.html">Home</a>
                    <a href="category.html">Categories</a>
                    <a href="about.html">About Us</a>
                    <a href="contact.html" class="active">Contact</a>
                </nav>
            </div>
        </header>

        <main class="main-content">
            <div class="container" style="padding: 60px 20px; max-width: 600px; text-align: center;">
                <h1 style="font-size: 36px; margin-bottom: 30px; color: var(--primary-color);">Contact Us</h1>
                <div class="contact-form">
                    <form onsubmit="event.preventDefault(); alert('Thank you for reaching out. We will get back to you shortly.'); this.reset();">
                        <div class="form-group">
                            <label>Name</label>
                            <input type="text" required placeholder="Your Full Name">
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" required placeholder="your.email@example.com">
                        </div>
                        <div class="form-group">
                            <label>Message</label>
                            <textarea rows="5" required placeholder="How can we help you?"></textarea>
                        </div>
                        <button type="submit" class="btn-primary" style="width: 100%;">Send Message</button>
                    </form>
                </div>
            </div>
        </main>

        <footer>
            <div class="container">
                <p class="copyright">&copy; 2026 DoctorWallah. All rights reserved.</p>
            </div>
        </footer>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
